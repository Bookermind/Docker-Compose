services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - TZ=Europe/London
      - N8n_HOST=n8n.bookermind.com
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.bookermind.com/
    volumes:
      - /mnt/docker/n8n/data:/home/node/.n8n
    restart: unless-stopped