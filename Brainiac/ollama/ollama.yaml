services:
  ollama-coder:
    image: docker.io/ollama/ollama:latest
    container_name: ollama-coder
    ports:
      - "11434:11434"
    volumes:
      - /mnt/docker/ollama/coder:/root/.ollama
    restart: unless-stopped
    runtime: nvidia
    environment:
      - OLLAMA_KEEP_ALIVE=5hr
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  ollama-planner:
    image: docker.io/ollama/ollama:latest
    container_name: ollama-planner
    ports:
      - "11435:11434"
    volumes:
      - /mnt/docker/ollama/planner:/root/.ollama
    restart: unless-stopped
    runtime: nvidia
    environment:
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
  chroma:
    image: chromadb/chroma:latest
    container_name: chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/.chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ALLOW_RESET=TRUE
      - PERSIST_DIRECTORY=/chroma/.chroma
      - CHROMA_SERVER_AUTH_PROVIDER=chromadb.auth.token.TokenAuthServerProvider
      - CHROMA_SERVER_AUTH_TOKEN=dev-token
      - CHROMA_SERVER_AUTH_TOKEN_TRANSPORT_HEADER=Authorization
    restart: unless-stopped

  chroma-mcp:
    image: mcp/chroma:latest
    container_name: chroma-mcp
    ports:
      - "8090:8080"
    depends_on:
      - chroma
    environment:
      - CHROMA_CLIENT_TYPE=http
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - CHROMA_CUSTOM_AUTH_CREDENTIALS=dev-token
      - CHROMA_SSL=false
    restart: unless-stopped

  searXNG:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    # Uncomment the following cap_drop after the fist run of searxng
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    ports:
      - 8080:8080
    volumes:
      - /mnt/docker/searxng/config:/etc/searxng/:rw
      - /mnt/docker/searxng/data:/var/cache/searxng
    environment:
      - SEARXNG_HOSTNAME=localhost:8080
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  searxng-valkey:
    image: docker.io/valkey/valkey:9-alpine
    container_name: searxng-valkey
    command: valkey-server --save 30 1 --loglevel warning
    restart: always
    volumes:
      - /mnt/docker/valkey:/data/

  redis:
    image: valkey/valkey:9.0.2
    platform: linux/amd64
    privileged: False
    restart: unless-stopped
    container_name: openwebui-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: Europe/London
    command:
      - "--port"
      - "6379"
      - "--requirepass"
      - ${REDIS_PASSWORD}
    healthcheck:
      interval: 30s
      retries: 5
      start_interval: 2s
      start_period: 15s
      test:
        - CMD
        - redis-cli
        - "-h"
        - 127.0.0.1
        - "-p"
        - "6379"
        - "-a"
        - ${REDIS_PASSWORD}
        - ping
      timeout: 5s
    volumes:
      - read_only: False
        source: redis_data
        target: /data
        type: volume
        volume:
          nocopy: False
  openwebui:
    image: ghcr.io/open-webui/open-webui
    platform: linux/amd64
    ports:
      - mode: ingress
        protocol: tcp
        published: 31028
        target: 31028
    environment:
      HOST: 0.0.0.0
      OLLAMA_BASE_URL: http://192.168.4.193:11435
      PORT: 31028
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379
      TZ: Europe/London
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
    healthcheck:
      interval: 30s
      retries: 5
      start_interval: 2s
      start_period: 15s
      test:
        - CMD
        - curl
        - "--request"
        - GET
        - "--silent"
        - "--output"
        - /dev/null
        - "--show-error"
        - "--fail"
        - http://127.0.0.1:31028/health
      timeout: 5s
    privileged: False
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - bind:
          create_host_path: True
        read_only: False
        source: /mnt/docker/openwebui/openwebui
        target: /app/backend/data
        type: bind
      - bind:
          create_host_path: True
        read_only: False
        source: /mnt/docker/openwebui/ollama
        target: /root/.ollama
        type: bind
    container_name: open-WebUI

volumes:
  redis_data: {}
  chroma_data: {}
