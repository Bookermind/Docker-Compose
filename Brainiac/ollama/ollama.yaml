services:
  ollama-coder:
    image: docker.io/ollama/ollama:latest
    container_name: ollama-coder
    ports:
      - "11434:11434"
    volumes:
      - /mnt/docker/ollama/coder:/root/.ollama
    restart: unless-stopped
    runtime: nvidia
    environment:
      - OLLAMA_KEEP_ALIVE=24hr
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

  ollama-planner:
    image: docker.io/ollama/ollama:latest
    container_name: ollama-planner
    ports:
      - "11435:11434"
    volumes:
      - /mnt/docker/ollama/planner:/root/.ollama
    restart: unless-stopped
    runtime: nvidia
    environment:
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]

   searXNG:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    volumes:
      - /mnt/docker/ollama/searxng/config:/etc/searxng/:Z
      - /mnt/docker/ollama/searxng/data:/var/cache/searxng
    restart: always

  searxng-valkey:
    image: docker.io/valkey/valkey:9-alpine
    container_name: searxng-valkey
    command: valkey-server --save 30 1 --loglevel warning
    restart: always
    volumes:
      - /mnt/docker/ollama/valkey:/data/
