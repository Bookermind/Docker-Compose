services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: 2000:2000
    ports:
      - 8096:8096/tcp
      - 7359:7359/udp
    volumes:
      - /home/simon/docker/plex/jellyfin/config:/config
      - /home/simon/docker/plex/jellyfin/cache:/cache
      - Movies:/mnt/movies
      - TV_Shows:/mnt/tv_shows
      - Music:/mnt/music
    restart: unless-stopped
    runtime: nvidia
    environment:
      - TZ=Europe/London
      - JELLYFIN_PublishedServerUrl=https://jellyfin.bookermind.com
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
          memory: 6G
        limits:
          memory: 8G
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    user: 2000:2000
    environment:
      - LOG_LEVEL=debug
      - TZ=Europe/London
      - PORT=5055
    ports:
      - 5055:5055
    volumes:
      - /home/simon/docker/plex/seerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
    depends_on:
      jellyfin:
        condition: service_healthy

volumes:
  Movies:
    external: True
  Music:
    external: True
  TV_Shows:
    external: True
